name: Build CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for installer (e.g. 6.1.0). Empty = skip.'
        required: false
        type: string
  push:
    branches: [ "master" ]
    tags:
      - 'ATARI800_*_*_*'
  pull_request:

jobs:
  build-amd64:
    name: Build on Linux amd64
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
    - uses: actions/checkout@v7
    - name: install depends
      run: |
        apt-get update
        apt-get install -y build-essential autoconf automake libtool pkg-config \
          libsdl2-dev libmp3lame-dev libreadline-dev libgl1-mesa-dev libpng-dev libcurl4-openssl-dev curl ca-certificates git gh
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --with-opengl --with-readline --with-mp3=lame --with-video=sdl2 --with-sound=sdl2
    - name: building
      run: make -j$(nproc)
    - name: run Acid800 test suite
      run: make check
    - name: Archive Atari800 binary
      uses: actions/upload-artifact@v7
      with:
        name: atari800-linux-amd64
        path: src/atari800

    - name: Build AppImage
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V=${{ inputs.version }}
        else
          V=${GITHUB_REF_NAME#ATARI800_}
          V=$(echo "$V" | sed 's/_/./g')
        fi
        echo "VERSION=$V" >> $GITHUB_ENV

        APPDIR="/tmp/Atari800-${V}.AppDir"
        mkdir -p "$APPDIR/usr/bin" \
                 "$APPDIR/usr/share/applications" \
                 "$APPDIR/usr/share/icons/hicolor/128x128/apps" \
                 "$APPDIR/usr/share/icons/hicolor/scalable/apps"

        cp src/atari800 "$APPDIR/usr/bin/"
        cp debian/atari800.desktop "$APPDIR/usr/share/applications/"
        cp data/atari1.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/atari800.png"
        cp data/atari2.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/atari800.svg"

        ln -s usr/share/applications/atari800.desktop "$APPDIR/"
        ln -s usr/share/icons/hicolor/128x128/apps/atari800.png "$APPDIR/atari800.png"

        echo '#!/bin/sh' > "$APPDIR/AppRun"
        echo 'HERE="$(dirname "$(readlink -f "$0")")"' >> "$APPDIR/AppRun"
        echo 'export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' >> "$APPDIR/AppRun"
        echo 'exec "$HERE/usr/bin/atari800" "$@"' >> "$APPDIR/AppRun"
        chmod +x "$APPDIR/AppRun"

        curl -sL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" \
          -o /tmp/linuxdeploy
        chmod +x /tmp/linuxdeploy
        APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy --appdir "$APPDIR"

        # Find and bundle any missing transitive dependencies
        for f in "$APPDIR/usr/bin/atari800" $(find "$APPDIR/usr/lib" -name '*.so*' -type f 2>/dev/null); do
          ldd "$f" 2>/dev/null | grep -E '=> /' | awk '{print $3}' | while read -r dep; do
            depname=$(basename "$dep")
            if [ ! -f "$APPDIR/usr/lib/$depname" ] && [ ! -L "$APPDIR/usr/lib/$depname" ]; then
              case "$depname" in
                libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libutil.so.*|libnss*|libnsl.so.*|libcrypt.so.*|ld-linux*)
                  ;;
                *)
                  cp -L "$dep" "$APPDIR/usr/lib/"
                  echo "Bundled missing dep: $depname"
                  ;;
              esac
            fi
          done
        done

        # Remove GPU driver libraries to avoid version conflicts with host system Mesa/libdrm
        rm -f "$APPDIR"/usr/lib/libdrm*.so.* "$APPDIR"/usr/lib/libgbm*.so.* "$APPDIR"/usr/lib/libgallium*.so.* \
              "$APPDIR"/usr/lib/libGL.so.* "$APPDIR"/usr/lib/libGLX.so.* "$APPDIR"/usr/lib/libEGL.so.* "$APPDIR"/usr/lib/libGLdispatch.so.* 2>/dev/null || true

        curl -sL "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" \
          -o /tmp/runtime-x86_64
        curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
          -o /tmp/appimagetool
        chmod +x /tmp/appimagetool
        APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --runtime-file /tmp/runtime-x86_64 "$APPDIR" "Atari800-${V}-x86_64.AppImage"

    - name: Upload AppImage
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      uses: actions/upload-artifact@v7
      with:
        name: atari800-linux-appimage
        path: Atari800-*.AppImage
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/ATARI800_')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" --repo ${{ github.repository }} 2>/dev/null || true
        gh release upload "$GITHUB_REF_NAME" Atari800-*-x86_64.AppImage --clobber --repo ${{ github.repository }}

  build-falcon:
    name: Build for ${{ matrix.title }}
    runs-on: ubuntu-24.04
    container:
      image: scummvm/dockerized-toolchains:atari

    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Falcon (default)
            artifact: atari800-falcon-default
            cpu: m68020-60
            flags: --target=falcon --enable-falconcpuasm --disable-interpolatesound
            output: atari800.gtp
          - title: Falcon (fast)
            artifact: atari800-falcon-fast
            cpu: m68020-60
            flags: --target=falcon --enable-falconcpuasm --disable-interpolatesound --disable-newcycleexact
            output: atarifst.gtp
          - title: Falcon (SDL)
            artifact: atari800-falcon-sdl
            cpu: m68020-60
            flags: --target=default --with-video=sdl --enable-falconcpuasm --disable-interpolatesound
            output: atarisdl.gtp
          - title: FireBee
            artifact: atari800-firebee
            cpu: m5475
            flags: --target=firebee --with-video=sdl --enable-pagedattrib --enable-cyclesperopcode
            output: atari_cf.gtp

    env:
      VASM_VERSION: 2_0f
      COMMON_FLAGS: >-
        --host=m68k-atari-mintelf --enable-veryslow --disable-nonlinear_mixing
        --disable-pbi_bb --disable-pbi_mio --with-readline=no
        --disable-monitorbreak --disable-monitorhints --disable-crashmenu
        --disable-monitorasm --disable-monitorutf8 --disable-monitoransi
        --disable-eventrecording --disable-pokeyrec --disable-videorecording
        --disable-screenshots --disable-audiorecording

    steps:
    - uses: actions/checkout@v7
    - name: install vasm
      run: |
        if command -v vasmm68k_mot >/dev/null; then
          echo "vasmm68k_mot already provided by the toolchain image"
          exit 0
        fi
        cd /tmp
        curl -sLO http://phoenix.owl.de/tags/vasm${VASM_VERSION}.tar.gz
        tar xzf vasm${VASM_VERSION}.tar.gz
        make -C vasm -j$(nproc) CPU=m68k SYNTAX=mot
        install -m 755 vasm/vasmm68k_mot /usr/local/bin/
    - name: select CPU-specific libraries
      run: echo "$(m68k-atari-mintelf-gcc -print-sysroot)/usr/bin/${{ matrix.cpu }}" >> $GITHUB_PATH
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure $COMMON_FLAGS ${{ matrix.flags }}
    - name: building
      run: make -j$(nproc)
    - name: fix up executable
      run: |
        m68k-atari-mintelf-stack --fix=256k src/atari800
        m68k-atari-mintelf-flags -S src/atari800
        m68k-atari-mintelf-strip -s src/atari800
        cp src/atari800 ${{ matrix.output }}
    - name: Archive Atari800 binary
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.output }}

  package-falcon:
    if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
    name: Package Falcon/FireBee
    runs-on: ubuntu-24.04
    needs: build-falcon

    steps:
    - uses: actions/checkout@v7
    - name: install depends
      run: |
        sudo apt-get update
        sudo apt-get install -y dos2unix
    - name: Download Falcon binaries
      uses: actions/download-artifact@v7
      with:
        pattern: atari800-falcon-*
        merge-multiple: true
        path: pkg
    - name: Download FireBee binary
      uses: actions/download-artifact@v7
      with:
        name: atari800-firebee
        path: pkg
    - name: Stage files and build archive
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V=${{ inputs.version }}
        else
          V=${GITHUB_REF_NAME#ATARI800_}
          V=$(echo "$V" | sed 's/_/./g')
        fi
        echo "VERSION=$V" >> $GITHUB_ENV
        test -f pkg/atari800.gtp && test -f pkg/atarifst.gtp \
          && test -f pkg/atarisdl.gtp && test -f pkg/atari_cf.gtp
        # TOS filenames are 8.3 and "atari800" already fills the name part, so the
        # version only fits as a <=3 char extension (7.1.2 -> atari800.712)
        SHORTVER=$(echo "$V" | tr -d '.')
        if [ ${#SHORTVER} -le 3 ]; then
          TOPDIR="atari800.$SHORTVER"
        else
          TOPDIR="atari800"
        fi
        mkdir -p pkg/$TOPDIR/act pkg/$TOPDIR/DOC
        mv pkg/*.gtp pkg/$TOPDIR/
        cp README.TXT pkg/$TOPDIR/readme.txt
        cp DOC/versions.falcon pkg/$TOPDIR/versions.txt
        cp COPYING pkg/$TOPDIR/
        cp act/*.act pkg/$TOPDIR/act/
        cp DOC/BUGS DOC/CREDITS DOC/FAQ DOC/NEWS DOC/README DOC/TODO DOC/USAGE pkg/$TOPDIR/DOC/
        # the Falcon specific one, INSTALL.falcon is not a valid 8.3 name
        cp DOC/INSTALL.falcon pkg/$TOPDIR/DOC/INSTALL
        # the repository keeps text files LF-only, convert them to CR/LF for TOS
        unix2dos pkg/$TOPDIR/readme.txt pkg/$TOPDIR/versions.txt pkg/$TOPDIR/COPYING pkg/$TOPDIR/DOC/*
        (cd pkg && zip -r "../atari800-${V}-falcon_and_firebee.zip" "$TOPDIR")
    - name: Archive portable zip
      uses: actions/upload-artifact@v7
      with:
        name: atari800-${{ env.VERSION }}-falcon_and_firebee
        path: atari800-*-falcon_and_firebee.zip
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/ATARI800_')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" 2>/dev/null || true
        gh release upload "$GITHUB_REF_NAME" atari800-*-falcon_and_firebee.zip --clobber

  build-linux-i386:
    name: Build on Linux i386
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Start 32-bit Debian container
      run: |
        docker run -d --name atari800-i386 --platform=linux/386 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          debian:trixie sleep infinity
        docker exec atari800-i386 apt-get update
        docker exec atari800-i386 apt-get install -y \
          build-essential autoconf automake libtool pkg-config \
          libsdl2-dev libmp3lame-dev libreadline-dev libpng-dev libcurl4-openssl-dev curl ca-certificates

    - name: Build in 32-bit Debian container
      run: |
        docker exec atari800-i386 bash -c "
            set -e
            ./autogen.sh
            ./configure --with-video=sdl2 --with-sound=sdl2 --with-mp3=lame
            make -j\$(nproc)
            test -f src/atari800 && echo 'Build succeeded'
          "

    - name: Package AppImage in 32-bit Debian container
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V=${{ inputs.version }}
        else
          V=${GITHUB_REF_NAME#ATARI800_}
          V=$(echo "$V" | sed 's/_/./g')
        fi

        docker exec -e V="$V" atari800-i386 bash -c "
            set -e

            APPDIR=\"/tmp/Atari800-\${V}.AppDir\"
            mkdir -p \"\$APPDIR/usr/bin\" \
                     \"\$APPDIR/usr/share/applications\" \
                     \"\$APPDIR/usr/share/icons/hicolor/128x128/apps\" \
                     \"\$APPDIR/usr/share/icons/hicolor/scalable/apps\"

            cp src/atari800 \"\$APPDIR/usr/bin/\"
            cp debian/atari800.desktop \"\$APPDIR/usr/share/applications/\"
            cp data/atari1.png \"\$APPDIR/usr/share/icons/hicolor/128x128/apps/atari800.png\"
            cp data/atari2.svg \"\$APPDIR/usr/share/icons/hicolor/scalable/apps/atari800.svg\"

            ln -s usr/share/applications/atari800.desktop \"\$APPDIR/\"
            ln -s usr/share/icons/hicolor/128x128/apps/atari800.png \"\$APPDIR/atari800.png\"

            echo '#!/bin/sh' > \"\$APPDIR/AppRun\"
            echo 'HERE=\"\$(dirname \"\$(readlink -f \"\$0\")\")\"' >> \"\$APPDIR/AppRun\"
            echo 'export LD_LIBRARY_PATH=\"\$HERE/usr/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\"' >> \"\$APPDIR/AppRun\"
            echo 'exec \"\$HERE/usr/bin/atari800\" \"\$@\"' >> \"\$APPDIR/AppRun\"
            chmod +x \"\$APPDIR/AppRun\"

            curl -sL \"https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-i386.AppImage\" \
              -o /tmp/linuxdeploy
            chmod +x /tmp/linuxdeploy
            APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy --appdir \"\$APPDIR\"

            # Find and bundle any missing transitive dependencies
            for f in \"\$APPDIR/usr/bin/atari800\" \$(find \"\$APPDIR/usr/lib\" -name '*.so*' -type f 2>/dev/null); do
              ldd \"\$f\" 2>/dev/null | grep -E '=> /' | awk '{print \$3}' | while read -r dep; do
                depname=\$(basename \"\$dep\")
                if [ ! -f \"\$APPDIR/usr/lib/\$depname\" ] && [ ! -L \"\$APPDIR/usr/lib/\$depname\" ]; then
                  case \"\$depname\" in
                    libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libutil.so.*|libnss*|libnsl.so.*|libcrypt.so.*|ld-linux*)
                      ;;
                    *)
                      cp -L \"\$dep\" \"\$APPDIR/usr/lib/\"
                      echo \"Bundled missing dep: \$depname\"
                      ;;
                  esac
                fi
              done
            done


            # Remove GPU driver libraries to avoid version conflicts with host system Mesa/libdrm
            rm -f \"\$APPDIR\"/usr/lib/libdrm*.so.* \"\$APPDIR\"/usr/lib/libgbm*.so.* \"\$APPDIR\"/usr/lib/libgallium*.so.* \
                  \"\$APPDIR\"/usr/lib/libGL.so.* \"\$APPDIR\"/usr/lib/libGLX.so.* \"\$APPDIR\"/usr/lib/libEGL.so.* \"\$APPDIR\"/usr/lib/libGLdispatch.so.* 2>/dev/null || true

            curl -sL \"https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-i686\" \
              -o /tmp/runtime-i686
            curl -sL \"https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-i686.AppImage\" \
              -o /tmp/appimagetool
            chmod +x /tmp/appimagetool
            APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --runtime-file /tmp/runtime-i686 \"\$APPDIR\" \"Atari800-\${V}-i386.AppImage\"
          "

    - name: Stop 32-bit Debian container
      if: always()
      run: docker rm -f atari800-i386 || true

    - name: Upload AppImage
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      uses: actions/upload-artifact@v7
      with:
        name: atari800-linux-i386-appimage
        path: Atari800-*.AppImage
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/ATARI800_')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" 2>/dev/null || true
        gh release upload "$GITHUB_REF_NAME" Atari800-*-i386.AppImage --clobber

  build-macos-arm64:
    name: Build on MacOS (arm64 slice)
    runs-on: macos-14

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
    - uses: actions/checkout@v7
    - name: install depends
      env:
        HOMEBREW_REQUIRE_TAP_TRUST: 0
      run: |
        # Explicitly install every auto-detected library so both slices
        # configure identically: AC_CHECK_LIB would otherwise silently
        # enable PNG screenshots/codecs and MP3 recording on whatever
        # runner happens to have them, diverging the dep closure below.
        brew install sdl2 automake readline libpng lame
        brew list --versions sdl2 automake readline libpng lame
    - name: autogen
      run: ./autogen.sh
    - name: build arm64 slice
      run: |
        # Point the build at Homebrew kegs explicitly: /usr/local is in
        # Apple's default search paths but /opt/homebrew (ARM) is not,
        # so without this ARM configure checks silently miss brew libs.
        BREW_PREFIX=$(brew --prefix)
        export CPPFLAGS="-I$BREW_PREFIX/include $CPPFLAGS"
        export LDFLAGS="-L$BREW_PREFIX/lib $LDFLAGS"
        mkdir -p macos-slice
        ./configure --with-opengl --with-video=sdl2 --with-sound=sdl2 --with-mp3=lame >macos-slice/configure.log 2>&1
        rc=$?
        tail -25 macos-slice/configure.log
        test $rc -eq 0
        # Fail fast (with evidence) if an expected feature got silently
        # disabled: a skew here would otherwise surface only at merge time.
        grep "Supported screenshot formats" macos-slice/configure.log | grep -q png || { echo "::error::PNG support not detected"; grep -B2 -A12 "png_get_libpng_ver" config.log | head -40; exit 1; }
        grep "Supported audio codecs" macos-slice/configure.log | grep -q mp3 || { echo "::error::MP3 support not detected"; grep -B2 -A12 "lame_init\|lame\.h" config.log | head -40; exit 1; }
        grep "Supported video codecs" macos-slice/configure.log | grep -q png || { echo "::error::PNG video codec not detected"; grep -B2 -A12 "png_get_libpng_ver" config.log | head -40; exit 1; }
        make -j$(sysctl -n hw.ncpu)
    - name: stage slice and Homebrew dylibs
      run: |
        # NB: no rm -rf here: the build step already placed
        # configure.log in macos-slice/ (runners are fresh VMs).
        mkdir -p macos-slice/lib
        cp src/atari800 macos-slice/atari800-arm64
        # Collect every Homebrew-provided dylib this slice links against,
        # following transitive references, so the package job can merge
        # them with the x86_64 counterparts via lipo.
        deps_of() {
          otool -L "$1" \
            | sed -nE 's/^[[:space:]]+((\/opt\/homebrew|\/usr\/local\/opt)\/[^ ]*).*/\1/p' \
            | sort -u
        }
        collect_libs() {
          local dep base out
          while read -r dep; do
            base=$(basename "$dep")
            out="macos-slice/lib/$base"
            if [ ! -f "$out" ]; then
              cp -L "$dep" "$out"
              collect_libs "$out"
            fi
          done < <(deps_of "$1")
        }
        collect_libs macos-slice/atari800-arm64
        # Only our own formulae: the runners' preinstalled sets
        # (browsers, php, …) legitimately differ and would never match.
        brew list --versions sdl2 automake readline libpng lame | sort > macos-slice/brew-versions.txt
        ls macos-slice macos-slice/lib
    - name: Upload arm64 slice
      uses: actions/upload-artifact@v7
      with:
        name: atari800-macos-arm64-slice
        path: macos-slice/

  build-macos-x86_64:
    name: Build on MacOS (x86_64 slice)
    # macos-15-intel is the last x86_64 image GitHub provides (retired
    # August 2027). When it goes away, this leg and the universal DMG
    # below must be revisited.
    runs-on: macos-15-intel

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
    - uses: actions/checkout@v7
    - name: install depends
      env:
        HOMEBREW_REQUIRE_TAP_TRUST: 0
      run: |
        # Explicitly install every auto-detected library so both slices
        # configure identically: AC_CHECK_LIB would otherwise silently
        # enable PNG screenshots/codecs and MP3 recording on whatever
        # runner happens to have them, diverging the dep closure below.
        brew install sdl2 automake readline libpng lame
        brew list --versions sdl2 automake readline libpng lame
    - name: autogen
      run: ./autogen.sh
    - name: build x86_64 slice
      run: |
        # Point the build at Homebrew kegs explicitly: /usr/local is in
        # Apple's default search paths but /opt/homebrew (ARM) is not,
        # so without this ARM configure checks silently miss brew libs.
        BREW_PREFIX=$(brew --prefix)
        export CPPFLAGS="-I$BREW_PREFIX/include $CPPFLAGS"
        export LDFLAGS="-L$BREW_PREFIX/lib $LDFLAGS"
        mkdir -p macos-slice
        ./configure --with-opengl --with-video=sdl2 --with-sound=sdl2 --with-mp3=lame >macos-slice/configure.log 2>&1
        rc=$?
        tail -25 macos-slice/configure.log
        test $rc -eq 0
        # Fail fast (with evidence) if an expected feature got silently
        # disabled: a skew here would otherwise surface only at merge time.
        grep "Supported screenshot formats" macos-slice/configure.log | grep -q png || { echo "::error::PNG support not detected"; grep -B2 -A12 "png_get_libpng_ver" config.log | head -40; exit 1; }
        grep "Supported audio codecs" macos-slice/configure.log | grep -q mp3 || { echo "::error::MP3 support not detected"; grep -B2 -A12 "lame_init\|lame\.h" config.log | head -40; exit 1; }
        grep "Supported video codecs" macos-slice/configure.log | grep -q png || { echo "::error::PNG video codec not detected"; grep -B2 -A12 "png_get_libpng_ver" config.log | head -40; exit 1; }
        make -j$(sysctl -n hw.ncpu)
    - name: stage slice and Homebrew dylibs
      run: |
        # NB: no rm -rf here: the build step already placed
        # configure.log in macos-slice/ (runners are fresh VMs).
        mkdir -p macos-slice/lib
        cp src/atari800 macos-slice/atari800-x86_64
        # Collect every Homebrew-provided dylib this slice links against,
        # following transitive references, so the package job can merge
        # them with the arm64 counterparts via lipo.
        deps_of() {
          otool -L "$1" \
            | sed -nE 's/^[[:space:]]+((\/opt\/homebrew|\/usr\/local\/opt)\/[^ ]*).*/\1/p' \
            | sort -u
        }
        collect_libs() {
          local dep base out
          while read -r dep; do
            base=$(basename "$dep")
            out="macos-slice/lib/$base"
            if [ ! -f "$out" ]; then
              cp -L "$dep" "$out"
              collect_libs "$out"
            fi
          done < <(deps_of "$1")
        }
        collect_libs macos-slice/atari800-x86_64
        # Only our own formulae: the runners' preinstalled sets
        # (browsers, php, …) legitimately differ and would never match.
        brew list --versions sdl2 automake readline libpng lame | sort > macos-slice/brew-versions.txt
        ls macos-slice macos-slice/lib
    - name: Upload x86_64 slice
      uses: actions/upload-artifact@v7
      with:
        name: atari800-macos-x86_64-slice
        path: macos-slice/

  package-macos:
    name: Package MacOS (universal)
    runs-on: macos-14
    needs: [build-macos-arm64, build-macos-x86_64]

    steps:
    - uses: actions/checkout@v7
    - name: Download arm64 slice
      uses: actions/download-artifact@v7
      with:
        name: atari800-macos-arm64-slice
        path: slice-arm64
    - name: Download x86_64 slice
      uses: actions/download-artifact@v7
      with:
        name: atari800-macos-x86_64-slice
        path: slice-x86_64
    - name: merge universal binary and libraries
      run: |
        echo "=== arm64 slice contents ==="
        ls slice-arm64 slice-arm64/lib
        echo "=== x86_64 slice contents ==="
        ls slice-x86_64 slice-x86_64/lib
        echo "=== brew formula versions (arm64 vs x86_64) ==="
        diff slice-arm64/brew-versions.txt slice-x86_64/brew-versions.txt \
          && echo "brew versions identical" \
          || echo "::warning::brew formula versions differ between slices (see diff above)"
        # Both slices must configure with identical features; a skew here
        # (e.g. PNG screenshots auto-detected on one runner only) would
        # otherwise surface later as an unpairable dylib. Compare only the
        # CONFIGURATION RESULTS summary, whose lines are plain yes/no
        # feature values with no paths.
        # Compare only the feature summary: it ends where the
        # Main build variables block (CC/CFLAGS/LIBS with runner-local
        # paths and compiler defaults) begins.
        summary() { sed -n '/CONFIGURATION RESULTS:/,/Main build variables:/p' "$1" | grep -v '^Main build variables:' | grep -v '^$'; }
        summary slice-arm64/configure.log > /tmp/config-arm64.txt
        summary slice-x86_64/configure.log > /tmp/config-x86_64.txt
        if ! diff /tmp/config-arm64.txt /tmp/config-x86_64.txt; then
          echo "::error::slices configured with different features (see diff above)"
          exit 1
        fi
        # On a pairing failure below, show which binary/library pulls in
        # the one-sided dylib, so the cause is obvious from this log.
        missing_refs() {
          local base="$1" dir="$2" b
          for b in "$dir"/atari800-* "$dir"/lib/*; do
            [ -f "$b" ] || continue
            if otool -L "$b" 2>/dev/null | grep -q "/$base"; then
              echo "  referenced by: $b"
            fi
          done
        }
        lipo -create slice-arm64/atari800-arm64 slice-x86_64/atari800-x86_64 -output atari800-universal
        lipo -info atari800-universal
        archs=$(lipo -archs atari800-universal)
        case " $archs " in
          *" x86_64 "*)
            case " $archs " in
              *" arm64 "*) ;;
              *)
                echo "::error::merged binary is missing the arm64 slice (got: $archs)"
                exit 1
                ;;
            esac
            ;;
          *)
            echo "::error::merged binary is missing the x86_64 slice (got: $archs)"
            exit 1
            ;;
        esac
        # Merge each dependency dylib pair by basename. Both slices are
        # built against the same formulae, so every library must exist in
        # both slices; anything else is a hard error, not a silent
        # single-arch bundle.
        mkdir -p universal-libs
        for f in slice-arm64/lib/*; do
          base=$(basename "$f")
          if [ -f "slice-x86_64/lib/$base" ]; then
            lipo -create "$f" "slice-x86_64/lib/$base" -output "universal-libs/$base"
          else
            echo "::error::library $base has no x86_64 counterpart"
            missing_refs "$base" slice-arm64
            exit 1
          fi
        done
        for f in slice-x86_64/lib/*; do
          base=$(basename "$f")
          if [ ! -f "universal-libs/$base" ]; then
            echo "::error::library $base has no arm64 counterpart"
            missing_refs "$base" slice-x86_64
            exit 1
          fi
        done
        lipo -info universal-libs/*
        cp atari800-universal src/atari800
    - name: Package .dmg
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          V=${{ inputs.version }}
        else
          V=${GITHUB_REF_NAME#ATARI800_}
          V=$(echo "$V" | sed 's/_/./g')
        fi
        echo "VERSION=$V" >> $GITHUB_ENV

        APP="Atari800.app"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/lib"

        cp src/atari800 "$APP/Contents/MacOS/"

        # Bundle the pre-merged universal (arm64+x86_64) dependency
        # libraries produced from the per-architecture slices.
        cp universal-libs/* "$APP/Contents/lib/"
        # Matches Homebrew install paths referenced by either slice: the
        # arm64 slice uses /opt/homebrew, the native Intel slice /usr/local.
        deps_of() {
          { otool -arch arm64 -L "$1"; otool -arch x86_64 -L "$1"; } \
            | sed -nE 's/^[[:space:]]+((\/opt\/homebrew|\/usr\/local\/opt)\/[^ ]*).*/\1/p' \
            | sort -u
        }

        # Point all references at the bundled copies. install_name_tool rewrites
        # the load commands of every slice of a fat binary in one go.
        patch_refs() {
          local bin="$1" dep
          while read -r dep; do
            install_name_tool -change "$dep" "@executable_path/../lib/$(basename "$dep")" "$bin"
          done < <(deps_of "$bin")
        }

        patch_refs "$APP/Contents/MacOS/atari800"
        for lib in "$APP"/Contents/lib/*; do
          patch_refs "$lib"
          install_name_tool -id "@executable_path/../lib/$(basename "$lib")" "$lib"
        done

        # Fail if any Homebrew reference survived the rewrite.
        leftover=$(for bin in "$APP/Contents/MacOS/"* "$APP"/Contents/lib/*; do deps_of "$bin"; done)
        if [ -n "$leftover" ]; then
          echo "::error::Unbundled dependencies remain:"
          echo "$leftover"
          exit 1
        fi

        cp README.TXT "$APP/Contents/Resources/"
        cp COPYING "$APP/Contents/Resources/"
        cp DOC/USAGE "$APP/Contents/Resources/"
        cp DOC/INSTALL "$APP/Contents/Resources/"
        cp DOC/NEWS "$APP/Contents/Resources/"
        mkdir -p "$APP/Contents/Resources/act"
        cp act/*.act "$APP/Contents/Resources/act/"

        cat > "$APP/Contents/Resources/FIRST_LAUNCH.txt" <<'EOF'
        First launch note
        -----------------

        Atari800.app is signed with an ad-hoc signature (no Apple Developer ID
        certificate), so macOS may refuse its very first launch with a message
        like "Atari800 is damaged and can't be opened" or "Apple could not
        verify Atari800 is free of malware".

        To start the application anyway:

          * Right-click (or Ctrl-click) Atari800.app and choose "Open", then
            confirm with "Open" again. This only has to be done once, or
          * open System Settings > Privacy & Security, scroll down to the
            Security section and click "Open Anyway".

        The warning is expected for applications distributed outside the Mac
        App Store without notarization; the disk image itself is intact.
        EOF

        mkdir -p Atari800.iconset
        for size in 16 32 48 128 256 512; do
          sips -z $size $size data/atari1.png \
            --out "Atari800.iconset/icon_${size}x${size}.png" >/dev/null 2>&1
        done
        sips -z 32 32 data/atari1.png \
          --out Atari800.iconset/icon_16x16@2x.png >/dev/null 2>&1
        sips -z 64 64 data/atari1.png \
          --out Atari800.iconset/icon_32x32@2x.png >/dev/null 2>&1
        sips -z 256 256 data/atari1.png \
          --out Atari800.iconset/icon_128x128@2x.png >/dev/null 2>&1
        sips -z 512 512 data/atari1.png \
          --out Atari800.iconset/icon_256x256@2x.png >/dev/null 2>&1
        iconutil -c icns Atari800.iconset
        cp Atari800.icns "$APP/Contents/Resources/"

        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
          echo '  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
          echo '<plist version="1.0">'
          echo '<dict>'
          echo '  <key>CFBundleDevelopmentRegion</key>'
          echo '  <string>English</string>'
          echo '  <key>CFBundleExecutable</key>'
          echo '  <string>atari800</string>'
          echo '  <key>CFBundleIconFile</key>'
          echo '  <string>Atari800</string>'
          echo '  <key>CFBundleIdentifier</key>'
          echo '  <string>org.atari800.atari800</string>'
          echo '  <key>CFBundleInfoDictionaryVersion</key>'
          echo '  <string>6.0</string>'
          echo '  <key>CFBundleName</key>'
          echo '  <string>Atari800</string>'
          echo '  <key>CFBundlePackageType</key>'
          echo '  <string>APPL</string>'
          echo '  <key>CFBundleShortVersionString</key>'
          echo "  <string>${V}</string>"
          echo '  <key>CFBundleVersion</key>'
          echo "  <string>${V}</string>"
          echo '  <key>NSHighResolutionCapable</key>'
          echo '  <true/>'
          echo '</dict>'
          echo '</plist>'
        } > "$APP/Contents/Info.plist"

        # Ad-hoc sign everything. install_name_tool above invalidated the
        # linker's automatic ad-hoc signatures, and Apple Silicon refuses to
        # run any Mach-O whose signature is missing or broken (Gatekeeper
        # reports the app as "damaged" and tells users to eject the image).
        # Sign dylibs first, then the executable, then the bundle; verify
        # without swallowing errors.
        find "$APP" -name '*.dylib' -exec codesign --force --sign - {} +
        codesign --force --sign - "$APP/Contents/MacOS/atari800"
        codesign --force --deep --sign - "$APP"
        codesign --verify --deep --strict "$APP"

        DMG="Atari800-${V}-macos-universal.dmg"
        hdiutil create -volname "Atari800 ${V}" -srcfolder "$APP" \
          -ov -format UDZO "$DMG"
        hdiutil verify "$DMG"

        # Smoke-test the packaged image: checksums, signature validity, both
        # CPU slices present, and that the binary actually starts. "-help"
        # makes Atari800_Initialise return FALSE after printing usage, so the
        # expected exit code is 3; anything else (e.g. SIGKILL on a broken
        # signature) fails the build.
        hdiutil attach -readonly -nobrowse "$DMG"
        MNT="/Volumes/Atari800 ${V}"
        codesign --verify --deep --strict "$MNT/$APP"
        lipo -archs "$MNT/$APP/Contents/MacOS/atari800"
        set +e
        "$MNT/$APP/Contents/MacOS/atari800" -config /dev/null -nosound -help >/dev/null 2>&1
        RC=$?
        set -e
        if [ "$RC" != 3 ]; then
          echo "::error::packaged binary failed to start (exit $RC)"
          hdiutil detach "$MNT" || true
          exit 1
        fi
        hdiutil detach "$MNT"

    - name: Upload DMG
      if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
      uses: actions/upload-artifact@v7
      with:
        name: atari800-macos-universal-dmg
        path: Atari800-*-macos-universal.dmg
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/ATARI800_')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" 2>/dev/null || true
        gh release upload "$GITHUB_REF_NAME" Atari800-*-macos-universal.dmg --clobber
    - name: Archive Atari800 binary
      uses: actions/upload-artifact@v7
      with:
       name: atari800-macos-universal
       path: src/atari800

  build-windows-msys2:
    name: Build on Windows MSYS2
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            autoconf
            automake
            libtool
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-curl-winssl
            zip

      - name: Run autoreconf
        run: autoreconf -fiv

      - name: Configure project
        run: ./configure --with-video=sdl2 --with-sound=sdl2 --with-mp3=lame

      - name: Build project
        run: make -j$(nproc)

      - name: Verify build
        run: |
          if [ ! -f src/atari800.exe ]; then
            echo "Build failed"
            exit 1
          fi
          echo "Build succeeded"

      - name: Embed app icon
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        run: |
          cd src
          windres --include-dir .. -i atari800_res.rc -o atari800_res_icon.o
          rm -f atari800.exe
          make atari800.exe atari800_LDADD="atari800_res_icon.o"

      - name: Archive plain binary
        uses: actions/upload-artifact@v7
        with:
          name: atari800-windows-msys2
          path: src/atari800.exe

      - name: Stage files and build installer
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        shell: msys2 {0}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V=${{ inputs.version }}
          else
            V=${GITHUB_REF_NAME#ATARI800_}
            V=$(echo "$V" | sed 's/_/./g')
          fi
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir -p pkg/act pkg/doc
          cp src/atari800.exe pkg/
          ldd src/atari800.exe | grep '\/mingw64\/bin\/' | \
            awk '{print $3}' | xargs -I{} cp {} pkg/
          cp README.TXT pkg/
          cp act/*.act pkg/act/
          cp data/atari800.ico pkg/
          cp COPYING pkg/doc/COPYING.txt
          cp DOC/INSTALL pkg/doc/INSTALL.txt
          cp DOC/NEWS pkg/doc/NEWS.txt
          cp DOC/USAGE pkg/doc/USAGE.txt
          makensis -DVERSION=$V -DPLATFORM=win64 atari800.nsi
          (cd pkg && zip -r "../atari800-${V}-win64.zip" .)

      - name: Verify installer
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        shell: msys2 {0}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V=${{ inputs.version }}
          else
            V=${GITHUB_REF_NAME#ATARI800_}
            V=$(echo "$V" | sed 's/_/./g')
          fi
          test -f atari800-$V-win64.zip && echo "Installer OK: atari800-$V-win64.zip"

      - name: Archive portable zip
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: atari800-${{ env.VERSION }}-win64-portable
          path: atari800-*-win64.zip
      - name: Archive installer exe
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: atari800-${{ env.VERSION }}-win64-installer
          path: atari800-*-win64.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/ATARI800_')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" atari800-*-win64.exe atari800-*-win64.zip --clobber

  build-windows-msys2-32:
    name: Build on Windows MSYS2 (32-bit)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            base-devel
            mingw-w64-i686-toolchain
            autoconf automake libtool
            mingw-w64-i686-SDL2
            mingw-w64-i686-readline
            mingw-w64-i686-libpng
            mingw-w64-i686-nsis
            mingw-w64-i686-lame
            zip

      - name: Run autoreconf
        run: autoreconf -fiv

      - name: Configure project
        run: ./configure --with-video=sdl2 --with-sound=sdl2 --with-mp3=lame --disable-download

      - name: Build project
        run: make -j$(nproc)

      - name: Verify build
        run: |
          test -f src/atari800.exe && echo "Build succeeded"

      - name: Embed app icon
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        run: |
          cd src
          windres --include-dir .. -i atari800_res.rc -o atari800_res_icon.o
          rm -f atari800.exe
          make atari800.exe atari800_LDADD="atari800_res_icon.o"

      - name: Archive plain binary
        uses: actions/upload-artifact@v7
        with:
          name: atari800-windows-msys2-32
          path: src/atari800.exe

      - name: Stage files and build installer
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V=${{ inputs.version }}
          else
            V=${GITHUB_REF_NAME#ATARI800_}
            V=$(echo "$V" | sed 's/_/./g')
          fi
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir -p pkg/act pkg/doc
          cp src/atari800.exe pkg/
          for dll in SDL2.dll libmp3lame-0.dll libpng16-16.dll libreadline8.dll libtermcap-0.dll libwinpthread-1.dll zlib1.dll; do
            find /mingw32/bin -name "$dll" -exec cp {} pkg/ \; 2>/dev/null || true
          done
          find /mingw32/bin -name "libgcc_s_dw2-1.dll" -exec cp {} pkg/ \; 2>/dev/null || true
          cp README.TXT pkg/
          cp act/*.act pkg/act/
          cp data/atari800.ico pkg/
          cp COPYING pkg/doc/COPYING.txt
          cp DOC/INSTALL pkg/doc/INSTALL.txt
          cp DOC/NEWS pkg/doc/NEWS.txt
          cp DOC/USAGE pkg/doc/USAGE.txt
          makensis -DVERSION=$V -DPLATFORM=win32-no-network atari800.nsi
          (cd pkg && zip -r "../atari800-${V}-win32-no-network.zip" .)

      - name: Verify installer
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V=${{ inputs.version }}
          else
            V=${GITHUB_REF_NAME#ATARI800_}
            V=$(echo "$V" | sed 's/_/./g')
          fi
          test -f atari800-$V-win32-no-network.zip && echo "Installer OK: atari800-$V-win32-no-network.zip"

      - name: Archive portable zip
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: atari800-${{ env.VERSION }}-win32-no-network-portable
          path: atari800-*-win32-no-network.zip
      - name: Archive installer exe
        if: startsWith(github.ref, 'refs/tags/ATARI800_') || inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: atari800-${{ env.VERSION }}-win32-no-network-installer
          path: atari800-*-win32-no-network.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/ATARI800_')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" atari800-*-win32-no-network.exe atari800-*-win32-no-network.zip --clobber
